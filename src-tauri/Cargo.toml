[package]
name = "diffora"
version = "0.1.0"
description = "Lightweight file editor and read-only Git diff viewer"
edition = "2021"

[lib]
name = "diffora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
